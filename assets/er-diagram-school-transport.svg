<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      .entity { fill:#eaf4ff; stroke:#1f4e79; stroke-width:2; rx:10; ry:10; }
      .title { font: bold 22px Arial, sans-serif; fill:#0b3558; }
      .attr { font: 16px Arial, sans-serif; fill:#173f5f; }
      .pk { font: bold 16px Arial, sans-serif; fill:#0a5; }
      .fk { font: italic 16px Arial, sans-serif; fill:#9a3412; }
      .rel { stroke:#475569; stroke-width:2.2; marker-end:url(#arrow); }
      .card { font: bold 14px Arial, sans-serif; fill:#111827; }
      .label { font: 15px Arial, sans-serif; fill:#1f2937; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>

  <text x="450" y="45" class="title">School Transport Route DB - ER Diagram</text>

  <!-- Buses -->
  <rect x="80" y="120" width="280" height="180" class="entity"/>
  <text x="180" y="155" class="title" style="font-size:20px;">BUSES</text>
  <text x="105" y="190" class="pk">PK bus_id</text>
  <text x="105" y="220" class="attr">bus_number (UNIQUE)</text>
  <text x="105" y="250" class="attr">capacity</text>

  <!-- Drivers -->
  <rect x="80" y="390" width="280" height="210" class="entity"/>
  <text x="170" y="425" class="title" style="font-size:20px;">DRIVERS</text>
  <text x="105" y="460" class="pk">PK driver_id</text>
  <text x="105" y="490" class="attr">name</text>
  <text x="105" y="520" class="attr">phone (UNIQUE)</text>
  <text x="105" y="550" class="attr">license_no (UNIQUE)</text>

  <!-- Routes -->
  <rect x="540" y="220" width="320" height="260" class="entity"/>
  <text x="650" y="255" class="title" style="font-size:20px;">ROUTES</text>
  <text x="565" y="290" class="pk">PK route_id</text>
  <text x="565" y="320" class="attr">route_name (UNIQUE)</text>
  <text x="565" y="350" class="attr">start_point</text>
  <text x="565" y="380" class="attr">end_point</text>
  <text x="565" y="410" class="fk">FK bus_id → buses.bus_id</text>
  <text x="565" y="440" class="fk">FK driver_id → drivers.driver_id</text>

  <!-- Stops -->
  <rect x="1010" y="180" width="300" height="220" class="entity"/>
  <text x="1120" y="215" class="title" style="font-size:20px;">STOPS</text>
  <text x="1035" y="250" class="pk">PK stop_id</text>
  <text x="1035" y="280" class="attr">stop_name</text>
  <text x="1035" y="310" class="attr">area</text>
  <text x="1035" y="340" class="fk">FK route_id → routes.route_id</text>

  <!-- Students -->
  <rect x="1010" y="500" width="300" height="250" class="entity"/>
  <text x="1095" y="535" class="title" style="font-size:20px;">STUDENTS</text>
  <text x="1035" y="570" class="pk">PK student_id</text>
  <text x="1035" y="600" class="attr">student_name</text>
  <text x="1035" y="630" class="attr">grade</text>
  <text x="1035" y="660" class="attr">phone</text>
  <text x="1035" y="690" class="fk">FK stop_id → stops.stop_id</text>

  <!-- relationships -->
  <line x1="360" y1="210" x2="540" y2="300" class="rel"/>
  <text x="410" y="220" class="card">1</text>
  <text x="495" y="275" class="card">M</text>
  <text x="400" y="245" class="label">assigned to</text>

  <line x1="360" y1="500" x2="540" y2="390" class="rel"/>
  <text x="410" y="470" class="card">1</text>
  <text x="505" y="410" class="card">M</text>
  <text x="390" y="440" class="label">drives</text>

  <line x1="860" y1="300" x2="1010" y2="290" class="rel"/>
  <text x="905" y="285" class="card">1</text>
  <text x="980" y="285" class="card">M</text>
  <text x="900" y="310" class="label">has</text>

  <line x1="1160" y1="400" x2="1160" y2="500" class="rel"/>
  <text x="1175" y="440" class="card">1</text>
  <text x="1175" y="485" class="card">M</text>
  <text x="1188" y="465" class="label">pickup point for</text>
</svg>
