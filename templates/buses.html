{% extends 'base.html' %}
{% block content %}
<h2>Bus Management</h2>
<form method="post" class="row g-2 mb-4">
    <div class="col-md-5"><input class="form-control" name="bus_number" placeholder="Bus Number (e.g., BUS-101)" required /></div>
    <div class="col-md-5"><input class="form-control" type="number" name="capacity" placeholder="Capacity" required /></div>
    <div class="col-md-2"><button class="btn btn-primary w-100">Add Bus</button></div>
</form>

<table class="table table-bordered">
    <thead><tr><th>ID</th><th>Bus Number</th><th>Capacity</th><th>Action</th></tr></thead>
    <tbody>
    {% for b in buses %}
    <tr>
        <td>{{ b.bus_id }}</td><td>{{ b.bus_number }}</td><td>{{ b.capacity }}</td>
        <td>
            <form method="post" action="{{ url_for('delete_record', table='buses', record_id=b.bus_id) }}">
                <button class="btn btn-sm btn-danger" type="submit">Delete</button>
            </form>
        </td>
    </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
