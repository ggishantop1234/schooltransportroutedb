<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School Transport Route DB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet" />
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('index') }}">School Transport DB</a>
        <div>
            <a class="btn btn-light btn-sm" href="{{ url_for('buses') }}">Buses</a>
            <a class="btn btn-light btn-sm" href="{{ url_for('drivers') }}">Drivers</a>
            <a class="btn btn-light btn-sm" href="{{ url_for('routes') }}">Routes</a>
            <a class="btn btn-light btn-sm" href="{{ url_for('stops') }}">Stops</a>
            <a class="btn btn-light btn-sm" href="{{ url_for('students') }}">Students</a>
        </div>
    </div>
</nav>

<div class="container py-4">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</div>
</body>
</html>
